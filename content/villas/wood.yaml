photos:
  - wood/IMG_0878.jpg
  - wood/IMG_2224.jpg
  - wood/IMG_2375.jpg
  - wood/IMG_2683.jpg
  - wood/_CCN3744.jpg

# 在首頁空拍圖上的位置（百分比）：x、y 是左上角，w、h 是寬高
map_area:
  x: 74
  y: 61
  w: 16
  h: 11
