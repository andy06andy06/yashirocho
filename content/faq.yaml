# 入住須知與常見問題
# 回答可以用簡單格式：
#   **粗體**         → 粗體字
#   以「- 」開頭的行 → 條列項目
#   空一行           → 新段落

items:
  - question:
      zh: 入住與退房時間是幾點？可以延遲退房嗎？
      en: What are the check-in and check-out times? Can we check out late?
      ja: チェックイン・チェックアウトの時間は？レイトチェックアウトはできますか？
    answer:
      zh: |
        **標準時間：**入住時間為 15:00 - 18:00；退房時間為隔日 11:00 前。

        **延遲退房：**為維護住宿品質及房屋整理時間，退房時間為上午 11 點前：
        - 每延長一個小時，酌收新臺幣 1,000 元
        - 最晚延至下午 1 點

        **彈性調整：**為了讓房務夥伴有充足時間整理環境，若需提早入住或延後退房，請提前與我們聯繫，我們將依當日房況協助安排。若預計晚上 9 點後抵達，也請提前告知，我們會為您安排入住事宜。
      en: |
        **Standard times:** Check-in is between 15:00 and 18:00; check-out is before 11:00 the next morning.

        **Late check-out:** To keep up the quality of each stay and leave time for housekeeping, check-out is before 11:00.
        - Each extra hour is NT$1,000
        - The latest possible check-out is 13:00

        **Flexible arrangements:** If you need an early check-in or late check-out, please contact us in advance and we will arrange it based on that day's bookings. If you expect to arrive after 21:00, let us know beforehand so we can arrange your check-in.
      ja: |
        **標準時間：**チェックインは 15:00〜18:00、チェックアウトは翌日 11:00 までです。

        **レイトチェックアウト：**滞在の質と清掃時間を確保するため、チェックアウトは午前 11:00 までとなります。
        - 1時間の延長ごとに NT$1,000
        - 最長で午後 1:00 まで

        **ご相談について：**アーリーチェックインやレイトチェックアウトをご希望の場合は、事前にご連絡ください。当日の状況に応じて調整いたします。21:00 以降のご到着となる場合も、事前にお知らせください。

  - question:
      zh: 入住需要支付押金嗎？退還的標準是什麼？
      en: Is there a deposit? How is it refunded?
      ja: デポジットは必要ですか？返金の基準は？
    answer:
      zh: |
        為維護高品質住宿環境，入住時將收取 **$5,000 的環境維護押金**。

        退房當日下午，管家確認以下事項無誤後，將以轉帳方式全額退還：
        - 垃圾已分類、廚具與餐具已清洗歸位。
        - 傢俱、電器、寢具無損壞或無法清除之污漬（包含寵物便溺、人為嘔吐物等）。
        - 室內全面禁菸（含電子菸），違者加收「一日房費」空氣淨化費。
        - 無違法與危險行為（嚴禁施放煙火、仙女棒、使用明火/電磁爐，毒品等違法行為將立即報警並取消住宿）。
      en: |
        A **NT$5,000 maintenance deposit** is collected at check-in.

        It is refunded in full by bank transfer on the afternoon of check-out, once our host has confirmed that:
        - Rubbish is sorted, and cookware and dishes are washed and put away.
        - Furniture, appliances and bedding are undamaged and free of stains that can't be removed (including pet accidents or vomit).
        - No one smoked indoors, including e-cigarettes. Smoking indoors incurs an air-purification fee equal to one night's rate.
        - There was no illegal or dangerous activity. Fireworks, sparklers, open flames and portable hotplates are not allowed; drug use will be reported to the police and the stay cancelled.
      ja: |
        チェックイン時に **環境維持デポジットとして NT$5,000** をお預かりします。

        チェックアウト当日の午後、スタッフが以下を確認したのち、振込にて全額返金いたします。
        - ゴミが分別され、調理器具と食器が洗って元の場所に戻されていること。
        - 家具・家電・寝具に破損や落ちない汚れ（ペットの粗相や嘔吐物を含む）がないこと。
        - 室内は電子タバコを含め全面禁煙です。違反の場合は「1泊分の料金」を空気清浄費として申し受けます。
        - 違法・危険な行為がないこと（花火、線香花火、直火、持ち込みの電気調理器は禁止。薬物などの違法行為は直ちに警察へ通報し、宿泊を取り消します）。

  - question:
      zh: 有提供哪些備品？續住會更換嗎？
      en: What toiletries are provided? Are they changed during longer stays?
      ja: アメニティは何がありますか？連泊中の交換は？
    answer:
      zh: |
        **綠色旅遊：**響應環保愛地球，館內僅提供浴巾與毛巾，不提供一次性消耗備品（如牙刷、梳子等），敬請自備。

        **續住規範：**續住期間我們不主動更換毛巾與浴巾。為了感謝您與我們一起減少碳足跡，我們將為您提供專屬的續住優惠價。
      en: |
        **Green travel:** We provide bath towels and hand towels only. Single-use items such as toothbrushes and combs are not provided, so please bring your own.

        **Longer stays:** Towels are not changed automatically during consecutive nights. As thanks for helping reduce waste, we offer a special rate for consecutive stays.
      ja: |
        **グリーンツーリズム：**環境への配慮から、バスタオルとフェイスタオルのみご用意しています。歯ブラシやくしなどの使い捨てアメニティはございませんので、ご持参ください。

        **連泊について：**連泊中のタオル交換は基本的に行っておりません。環境へのご協力への感謝として、連泊特別料金をご用意しています。

  - question:
      zh: 可以帶寵物（毛小孩）一起入住嗎？有什麼規定？
      en: Can we bring pets? What are the rules?
      ja: ペットと一緒に泊まれますか？決まりはありますか？
    answer:
      zh: |
        我們非常歡迎毛小孩同樂！請注意此服務為**指定棟別且須事先預約**。

        **寵物清潔費：**$500 / 隻。

        **毛孩住宿公約：**
        - 請自備毛孩專屬的籠子、睡墊及尿布。
        - 嚴禁毛孩上床、上沙發或進入戲水池。
        - 毛孩的便溺請家長隨手清理。若不慎弄髒環境或留下異味，將酌收 $3,000 的深度清潔費。
      en: |
        Pets are very welcome! This is available in **selected villas only and must be booked in advance**.

        **Pet cleaning fee:** NT$500 per pet.

        **House rules for pets:**
        - Please bring your pet's own crate, bed and pee pads.
        - Pets may not go on beds or sofas, or into the pool.
        - Please clean up after your pet straight away. If anything is soiled or left with an odour, a NT$3,000 deep-cleaning fee applies.
      ja: |
        ペットとのご宿泊も大歓迎です。ただし **指定の棟のみ、事前予約が必要** です。

        **ペット清掃料：**1匹につき NT$500。

        **ペット同伴のお約束：**
        - ケージ、ベッド、トイレシートはご持参ください。
        - ベッドやソファに乗せたり、プールに入れたりしないでください。
        - 排泄物はその都度片付けてください。汚れや臭いが残った場合は、特別清掃費として NT$3,000 を申し受けます。

  - question:
      zh: 在民宿烤肉、辦聚會，有什麼需要注意的嗎？
      en: Anything to know about barbecues and parties?
      ja: バーベキューやパーティーをするときの注意点は？
    answer:
      zh: |
        **外燴與活動：**若有邀請外燴、餐車或表演團體，我們將酌收場地借用費 $1,000。

        **場地維護：**烤肉時請勿移動烤爐以策安全。歡聚後，請協助將廚房餐具/鍋具清洗歸位，並將桌面與垃圾收拾整齊。

        **寧靜時刻：**夜晚 22:00 後請將音量放小，讓歡笑聲留在屋內，與鄰里共享靜謐夜晚。

        **訪客規範：**若有非住宿訪客，費用為 $500 / 位，且須於 22:00 前道別離場。
      en: |
        **Catering and events:** If you bring in caterers, a food truck or performers, there is a NT$1,000 venue fee.

        **Looking after the space:** For safety, please don't move the grill. After the party, please wash and put away dishes and cookware, and tidy the tables and rubbish.

        **Quiet hours:** After 22:00, please keep the volume down and the laughter indoors, so the neighbours can enjoy a quiet night too.

        **Visitors:** Visitors who are not staying overnight are NT$500 per person and must leave by 22:00.
      ja: |
        **ケータリング・催し：**ケータリング、キッチンカー、出演者を呼ぶ場合は、会場使用料として NT$1,000 を申し受けます。

        **お片付け：**安全のため、グリルは動かさないでください。お楽しみのあとは、食器や調理器具を洗って元に戻し、テーブルとゴミの片付けにご協力ください。

        **夜の静けさ：**22:00 以降は音量を控え、笑い声は室内でお楽しみください。

        **訪問者：**宿泊されない方の訪問は1名につき NT$500、22:00 までにお帰りいただきます。

  - question:
      zh: 使用館內設施（熱水、戲水池、樓梯）有什麼安全提醒？
      en: Any safety notes for the hot water, pool and stairs?
      ja: お湯、プール、階段の安全上の注意は？
    answer:
      zh: |
        **洗澡熱水：**本館採用蓄熱式熱水器。若前一位家人泡澡或沖洗較久，建議下一位稍微等待 20-30 分鐘讓熱水補滿，洗沐感會更舒適。

        **兒童安全：**戲水池、浴缸與樓梯間請家長務必全程陪伴孩童，共創安全的親子回憶（本館已投保公共意外責任險，安心有保障）。

        **環境安全：**為保障您的安全並避免爭議，一樓公共空間與公共區域設有安全攝影設備，靜靜守護您的美好假期。室內請換穿我們準備的室內拖鞋（請勿外穿）以防光滑地面跌倒。
      en: |
        **Hot water:** The villas use storage water heaters. If someone before you had a long bath or shower, wait 20–30 minutes for the tank to refill.

        **Children:** Please stay with children at all times around the pool, bathtubs and stairs. The property carries public liability insurance.

        **Safety:** For your safety and to avoid disputes, there are security cameras in the ground-floor shared spaces and outdoor areas. Please wear the indoor slippers provided (not outdoors) to avoid slipping on smooth floors.
      ja: |
        **給湯：**貯湯式の給湯器を使用しています。前の方が長く入浴された場合は、お湯がたまるまで 20〜30 分ほどお待ちください。

        **お子様の安全：**プール、浴槽、階段の周りでは、保護者の方が必ずお子様に付き添ってください（当館は施設賠償責任保険に加入しています）。

        **防犯と安全：**安全確保とトラブル防止のため、1階の共用スペースと屋外エリアに防犯カメラを設置しています。滑りやすい床での転倒を防ぐため、ご用意した室内用スリッパをご利用ください（屋外ではお使いにならないでください）。
